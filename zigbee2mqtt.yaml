services:
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
    # The frontend listens on 9123 (set in configuration.yaml). There is nothing
    # on 8080, so the old 8084:8080 mapping published a closed port.
    ports:
      - 8084:8080
      - 9123:9123
    volumes:
      - zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/serial/by-id/${ZIGBEE_TONGLE_ID}:/dev/ttyUSB0
    networks:
      - iot
    # The container stays "Up" when the coordinator wedges; this catches that.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9123/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: 1.0

volumes:
  zigbee2mqtt:
    name: zigbee2mqtt

networks:
  iot:
    name: iot
    external: true
