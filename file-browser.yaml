services:
  file-browser:
    image: filebrowser/filebrowser:latest
    container_name: file-browser
    restart: unless-stopped
    network_mode: bridge
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    user: ${UID:-1000}:${GID:-1000}
    environment:
      TZ: Europe/Tallinn
      FB_USERNAME: ${USERNAME}
      FB_PASSWORD: ${PASSWORD}
    ports:
      - 8082:80
    volumes:
      - file-browser:/database
      - file-browser-config:/config
      - /mnt:/srv
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: 1.0

volumes:
  file-browser:
    name: file-browser
  file-browser-config:
    name: file-browser-config
