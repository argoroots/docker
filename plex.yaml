services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    restart: unless-stopped
    network_mode: host
    # No cap_drop here: the entrypoint chowns /config and drops to the plex user, which needs CHOWN/FOWNER/SETUID/SETGID/DAC_OVERRIDE.
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
    volumes:
      - plex:/config
      # Read-only: Plex never needs to write media, and ssd1 also holds the restic repo.
      - /mnt/ssd1:/data/ssd1:ro
      - /mnt/ssd2:/data/ssd2:ro
    # Plex is set never to transcode; the image declares /transcode as a volume and the tmpfs (empty, so no RAM used) only stops Docker creating a new anonymous volume on every recreate.
    tmpfs:
      - /transcode:size=2g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: 3.0

volumes:
  plex:
    name: plex
