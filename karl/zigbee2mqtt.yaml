services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    cap_drop:
      - all
    # Mosquitto starts as root and drops to the mosquitto user; without these it cannot make that switch and exits.
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      TZ: Europe/Tallinn
    # Published to localhost only: HA reaches it at 127.0.0.1 over host networking, Zigbee2MQTT as mosquitto:1883 on this stack's network. Nothing on the LAN can connect, which is what makes anonymous access acceptable.
    ports:
      - 127.0.0.1:1883:1883
    volumes:
      - /home/pi/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # The image declares these as volumes, so without tmpfs every recreate leaves a new anonymous volume behind. mosquitto.conf has persistence off, so nothing here needs to survive a restart.
    tmpfs:
      - /mosquitto/data:uid=1883,gid=1883
      - /mosquitto/log:uid=1883,gid=1883
    # A publish proves the broker is actually accepting connections, not just that the process is alive.
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
      # Checked every 5 s while starting, so Zigbee2MQTT is not held back a full interval.
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    # Only applies on deploy; after a reboot Docker starts both at once and Zigbee2MQTT may restart until the broker is up. It can also exit once at boot with "Not supported, cannot set" while the CC2531 is still enumerating; the restart policy recovers from both.
    depends_on:
      mosquitto:
        condition: service_healthy
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
    # The frontend listens on 9123, set in configuration.yaml. It is reachable from the LAN (http://ha.local:9123), so set frontend.auth_token there; without it anyone on the network can control every Zigbee device.
    ports:
      - 9123:9123
    volumes:
      - /home/pi/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      # Fails with this message instead of Docker's "not a device node" when the stack env var is missing.
      - /dev/serial/by-id/${ZIGBEE_TONGLE_ID:?set ZIGBEE_TONGLE_ID in the stack env to the dongle name from ls /dev/serial/by-id/}:/dev/ttyUSB0
    # The container stays "Up" when the process hangs; this catches that.
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9123/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: 1.0
