# Host kernel settings required by the OpenThread Border Router (openthread.yaml).
#
# The openthread-sysctl service copies this to /etc/sysctl.d/60-otbr.conf on
# deploy and applies it; systemd-sysctl re-applies it on every boot. This repo
# is the source of truth -- the copy on the Pi is generated, do not hand-edit it.
#
# Order matters: writing net.ipv6.conf.all.forwarding resets per-interface RA
# state, so the accept_ra settings must come after it.

# OTBR routes between the infra interface and the Thread mesh. Without IPv6
# forwarding, every Matter-over-Thread device is unreachable.
net.ipv6.conf.all.forwarding=1
net.ipv4.ip_forward=1

# The interface below must match OT_INFRA_IF in openthread.yaml.
#
# accept_ra=2 -- with forwarding enabled the kernel ignores RAs at the default
# of 1; 2 means "accept them anyway".
#
# accept_ra_rt_info_max_plen=64 -- defaults to 0, which discards the Route
# Information Option carrying OTBR's OMR prefix. Without this, border routing
# reports healthy (ot-ctl br state == running) while no device is reachable.
net.ipv6.conf.eth0.accept_ra=2
net.ipv6.conf.eth0.accept_ra_rt_info_max_plen=64
