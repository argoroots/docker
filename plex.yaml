services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Tallinn
    volumes:
      - plex:/config
      - /mnt/ssd1:/data/ssd1
      - /mnt/ssd2:/data/ssd2
    # Transcoding scratch in RAM: several GB written and deleted per session,
    # so keeping it off the NVMe saves write cycles and is faster.
    tmpfs:
      - /transcode:size=2g
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: 3.0

volumes:
  plex:
    name: plex
