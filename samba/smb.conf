# Samba on the host: Finder access to the SSDs as smb://pi.roots.ee. Installed by hand; see README.

[global]
   server string = Raspberry Pi
   server role = standalone server
   # Named users only, no guest access.
   map to guest = never
   # macOS speaks SMB3; older versions are insecure.
   server min protocol = SMB3
   # Encrypt all traffic; without this macOS and Samba agree on unencrypted SMB3, readable on Wi-Fi.
   server smb encrypt = required
   # No anonymous listing of the shares.
   restrict anonymous = 2
   # Home subnets only (the Mac is on 192.168.3.x, the Pi on 192.168.1.x), plus IPv6 link-local and the LAN prefix, which Finder may use when the Pi is picked from the sidebar.
   hosts allow = 192.168.0.0/16 127.0.0.1 fe80::/10 2001:7d0:55c0::/64 ::1

   # The SSDs are exFAT: no extended attributes, so Samba's macOS module (fruit + streams_xattr) can't be used and Finder keeps its metadata in ._ files. catia maps characters macOS allows in names but SMB doesn't.
   vfs objects = catia

   # No printers.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

# exFAT has no owners or permissions; who may write is set by the drives' mount options, so no create/directory masks here.
[ssd1]
   path = /mnt/ssd1
   valid users = pi
   read only = no

[ssd2]
   path = /mnt/ssd2
   valid users = pi
   read only = no
