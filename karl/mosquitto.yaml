services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    cap_drop:
      - all
    # Mosquitto starts as root and drops to the mosquitto user; without these it
    # cannot make that switch and exits.
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
    # Published to localhost only. Home Assistant reaches it over host networking
    # at 127.0.0.1; Zigbee2MQTT reaches it as mosquitto:1883 on the iot network,
    # which does not go through the published port. Nothing on the LAN can
    # connect, which is what makes anonymous access acceptable.
    ports:
      - 127.0.0.1:1883:1883
    volumes:
      - /home/pi/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - iot
    # A publish proves the broker is actually accepting connections, not just
    # that the process is alive.
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5

networks:
  iot:
    name: iot
    external: true
