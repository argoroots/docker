services:
  caddy:
    # The official image has no DNS provider plugins, so the DigitalOcean one is compiled in from the official builder image; no third-party image involved.
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:builder AS builder
        RUN xcaddy build --with github.com/caddy-dns/digitalocean@master
        FROM caddy:latest
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    image: caddy-digitalocean:local
    container_name: caddy
    restart: unless-stopped
    # Host networking so every service is reachable at 127.0.0.1, whether it runs on the host network or publishes to localhost.
    network_mode: host
    cap_drop:
      - all
    # Binding 80/443 needs this once all other capabilities are dropped.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
      # DigitalOcean API token with read/write access to the roots.ee domain; Caddy uses it to create the ACME DNS-01 TXT records.
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN}
    # The Caddyfile is written at start, like Mosquitto's config, so the whole proxy setup lives in this file. One wildcard certificate covers every subdomain; *.pi.roots.ee points at the Pi's LAN IP in public DNS, so nothing is reachable from the internet.
    command:
      - sh
      - -c
      - |
        cat > /etc/caddy/Caddyfile <<'EOF'
        *.pi.roots.ee {
        	tls {
        		dns digitalocean {env.DO_AUTH_TOKEN}
        	}

        	@ha host ha.pi.roots.ee
        	handle @ha {
        		reverse_proxy 127.0.0.1:8123
        	}

        	@z2m host z2m.pi.roots.ee
        	handle @z2m {
        		reverse_proxy 127.0.0.1:9123
        	}

        	@esphome host esphome.pi.roots.ee
        	handle @esphome {
        		reverse_proxy 127.0.0.1:6052
        	}

        	@music host music.pi.roots.ee
        	handle @music {
        		reverse_proxy 127.0.0.1:8095
        	}

        	@files host files.pi.roots.ee
        	handle @files {
        		reverse_proxy 127.0.0.1:8082
        	}

        	# Portainer only serves HTTPS with its own self-signed certificate.
        	@portainer host portainer.pi.roots.ee
        	handle @portainer {
        		reverse_proxy https://127.0.0.1:9443 {
        			transport http {
        				tls_insecure_skip_verify
        			}
        		}
        	}

        	# Unknown subdomains get no response rather than some other service.
        	handle {
        		abort
        	}
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      # Certificates and the ACME account; losing them only means re-issuing, but Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config
    labels:
      autoheal: "true"
    # The admin API only answers on localhost and proves Caddy is running with a loaded config.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.5

volumes:
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config
