services:
  # Docker refuses `sysctls:` on host-network services, so the host settings OTBR needs are written to /etc/sysctl.d here and applied. Runs once per deploy; systemd-sysctl re-applies the file on every boot.
  openthread-sysctl:
    image: alpine:latest
    container_name: openthread-sysctl
    restart: "no"
    network_mode: host
    privileged: true
    environment:
      TZ: Europe/Tallinn
    command:
      - sh
      - -c
      - |
        cat > /etc/sysctl.d/60-otbr.conf <<'EOF'
        # Managed by openthread.yaml -- edits on the host are overwritten.
        # Order matters: writing all.forwarding resets per-interface RA state, so the accept_ra settings must come after it.

        # Without forwarding, OTBR cannot route between the infra interface and the Thread mesh, and every Matter device is unreachable.
        net.ipv6.conf.all.forwarding=1
        net.ipv4.ip_forward=1

        # Must match OT_INFRA_IF below. wlan0, not eth0: the wired segment does not carry mDNS from the WiFi clients, so discovery only works here.
        # accept_ra=2 accepts RAs despite forwarding being on.
        net.ipv6.conf.wlan0.accept_ra=2
        # accept_ra_rt_info_max_plen defaults to 0, which drops the Route Information Option carrying the OMR prefix -- border routing then reports healthy while nothing is reachable.
        net.ipv6.conf.wlan0.accept_ra_rt_info_max_plen=64

        # eth0 shares the LAN with wlan0, so it hears OTBR's own RAs and installs a route to the OMR prefix via the Pi itself, at a better metric than the real wpan0 route. Traffic to Thread devices then loops until the hop limit expires and every Matter operation times out.
        net.ipv6.conf.eth0.accept_ra=0
        net.ipv6.conf.eth0.accept_ra_rt_info_max_plen=0
        EOF
        sysctl -p /etc/sysctl.d/60-otbr.conf
    volumes:
      - /etc/sysctl.d:/etc/sysctl.d
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: 0.1

  openthread:
    image: openthread/border-router:latest
    container_name: openthread
    restart: unless-stopped
    network_mode: host
    depends_on:
      openthread-sysctl:
        condition: service_completed_successfully
    cap_drop:
      - all
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    group_add:
      - 20
    environment:
      TZ: Europe/Tallinn
      OT_INFRA_IF: wlan0
      OT_LOG_LEVEL: 3
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyUSB0?uart-baudrate=460800"
      # Already the image's defaults; pinned so the unauthenticated REST API (it serves the Thread network key) and web UI never reach the LAN. HA and matter-thread-credentials use 127.0.0.1.
      OT_REST_LISTEN_ADDR: 127.0.0.1
      OT_WEB_LISTEN_ADDR: 127.0.0.1
      OT_THREAD_IF: wpan0
    volumes:
      - openthread:/data
    devices:
      - /dev/serial/by-id/${THREAD_TONGLE_ID}:/dev/ttyUSB0
      - /dev/net/tun:/dev/net/tun
    # "Up" is not the same as attached to the Thread network -- OTBR stays running while detached or with a wedged RCP.
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "ot-ctl state | grep -qE 'leader|router|child'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: 1.0

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - all
    security_opt:
      - apparmor=unconfined
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
    # --storage-path / --paa-root-cert-dir are the image's own defaults and must be repeated: setting `command` replaces them wholesale, and without the storage path the fabric and every commissioned node are lost on restart.
    # --primary-interface stops the controller advertising itself on every docker bridge and veth, where no device can reach it.
    # --bluetooth-adapter commissions over BLE from the Pi, so no phone is involved and no foreign Thread credentials get handed out.
    # --listen-address keeps the unauthenticated websocket API off the LAN; HA and matter-thread-credentials both connect via 127.0.0.1.
    command: >-
      --storage-path /data
      --paa-root-cert-dir /data/credentials
      --primary-interface wlan0
      --bluetooth-adapter 0
      --listen-address 127.0.0.1
    volumes:
      - matter-server:/data
      - /run/dbus:/run/dbus:ro
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 5580), 5)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: 1.0

  # matter-server keeps the Thread dataset in memory only, so every restart (nightly backup, autoheal) loses it and pairing a NEW device fails with "Required network information not provided ... thread (no)"; this checks every minute and re-sets it when missing.
  matter-thread-credentials:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-thread-credentials
    restart: unless-stopped
    network_mode: host
    depends_on:
      - openthread
      - matter-server
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
    entrypoint: ["python", "-c"]
    command:
      - |
        import asyncio, aiohttp
        OTBR = 'http://127.0.0.1:8081/node/dataset/active'
        WS = 'http://127.0.0.1:5580/ws'

        async def ensure_dataset(session):
            async with session.ws_connect(WS) as ws:
                info = await ws.receive_json()
                if info.get('thread_credentials_set'):
                    return
                async with session.get(OTBR, headers={'Accept': 'text/plain'}) as resp:
                    resp.raise_for_status()
                    dataset = (await resp.text()).strip().strip('"')
                await ws.send_json({
                    'message_id': 'set',
                    'command': 'set_thread_dataset',
                    'args': {'dataset': dataset},
                })
                print('dataset set:', await ws.receive_json(), flush=True)

        async def main():
            async with aiohttp.ClientSession() as session:
                while True:
                    try:
                        await ensure_dataset(session)
                    except Exception as err:
                        print('waiting for matter-server / otbr: %r' % err, flush=True)
                    await asyncio.sleep(60)

        asyncio.run(main())
    # The image declares /data as a volume; tmpfs stops Docker creating an anonymous volume for it. This container stores nothing.
    tmpfs:
      - /data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.25

volumes:
  openthread:
    name: openthread
  matter-server:
    name: matter-server
