services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    # Host networking: the Caddy widget needs Caddy's admin API, which only answers on 127.0.0.1:2019, and network usage must see the Pi's real interfaces. Listens on :3000 (allowed in the host firewall); Caddy serves it as https://pi.roots.ee.
    network_mode: host
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
      # Homepage refuses requests for any other Host header; the IP is the fallback when DNS or Caddy is down.
      HOMEPAGE_ALLOWED_HOSTS: pi.roots.ee,192.168.1.2:3000
      # Widget credentials, set as Portainer stack env; Homepage substitutes {{HOMEPAGE_VAR_*}} in the config below. A widget whose credentials are empty just shows an error.
      HOMEPAGE_VAR_HA_TOKEN: ${HA_TOKEN}
      HOMEPAGE_VAR_PLEX_TOKEN: ${PLEX_TOKEN}
      HOMEPAGE_VAR_PORTAINER_KEY: ${PORTAINER_KEY}
      HOMEPAGE_VAR_PORTAINER_ENV: ${PORTAINER_ENV:-1}
      HOMEPAGE_VAR_ESPHOME_USERNAME: ${ESPHOME_USERNAME}
      HOMEPAGE_VAR_ESPHOME_PASSWORD: ${ESPHOME_PASSWORD}
      HOMEPAGE_VAR_BESZEL_USERNAME: ${BESZEL_USERNAME}
      HOMEPAGE_VAR_BESZEL_PASSWORD: ${BESZEL_PASSWORD}
    # Homepage has no env-var configuration for services, so the config is written at start into a tmpfs; this file is the only place it lives.
    entrypoint: ["sh", "-c"]
    command:
      - |
        cat > /app/config/settings.yaml <<'EOF'
        title: Pi
        headerStyle: clean
        statusStyle: dot
        layout:
          Home:
            style: row
            columns: 3
          Media:
            style: row
            columns: 3
          Admin:
            style: row
            columns: 3
        EOF

        cat > /app/config/services.yaml <<'EOF'
        - Home:
            - Home Assistant:
                icon: home-assistant.png
                href: https://ha.pi.roots.ee
                siteMonitor: https://ha.pi.roots.ee
                widget:
                  type: homeassistant
                  url: http://127.0.0.1:8123
                  key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
                  fields: ["people_home", "lights_on", "switches_on"]
            - Zigbee2MQTT:
                icon: zigbee2mqtt.png
                href: https://z2m.pi.roots.ee
                siteMonitor: https://z2m.pi.roots.ee
            - ESPHome:
                icon: esphome.png
                href: https://esphome.pi.roots.ee
                siteMonitor: https://esphome.pi.roots.ee
                widget:
                  type: esphome
                  url: http://127.0.0.1:6052
                  username: "{{HOMEPAGE_VAR_ESPHOME_USERNAME}}"
                  password: "{{HOMEPAGE_VAR_ESPHOME_PASSWORD}}"
                  fields: ["total", "online", "offline"]
        - Media:
            - Plex:
                icon: plex.png
                href: https://app.plex.tv/desktop
                siteMonitor: http://127.0.0.1:32400/identity
                widget:
                  type: plex
                  url: http://127.0.0.1:32400
                  key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
            - Music Assistant:
                icon: music-assistant.png
                href: https://music.pi.roots.ee
                siteMonitor: https://music.pi.roots.ee
        - Admin:
            - Portainer:
                icon: portainer.png
                href: https://portainer.pi.roots.ee
                siteMonitor: https://portainer.pi.roots.ee
                widget:
                  type: portainer
                  # Through Caddy for a valid certificate; Portainer's own 9443 is self-signed.
                  url: https://portainer.pi.roots.ee
                  env: "{{HOMEPAGE_VAR_PORTAINER_ENV}}"
                  key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"
            - Caddy:
                icon: caddy.png
                description: Reverse proxy
                widget:
                  type: caddy
                  url: http://127.0.0.1:2019
            - File Browser:
                icon: filebrowser.png
                href: https://files.pi.roots.ee
                siteMonitor: https://files.pi.roots.ee
            - Beszel:
                icon: beszel.png
                href: https://d.tesla.roots.ee
                siteMonitor: https://d.tesla.roots.ee
                widget:
                  type: beszel
                  url: https://d.tesla.roots.ee
                  username: "{{HOMEPAGE_VAR_BESZEL_USERNAME}}"
                  password: "{{HOMEPAGE_VAR_BESZEL_PASSWORD}}"
                  # The system's name in Beszel; omit for an overview of all systems.
                  systemId: docker.local
                  version: 2
        EOF

        cat > /app/config/widgets.yaml <<'EOF'
        - resources:
            label: Pi
            cpu: true
            memory: true
            cputemp: true
            uptime: true
            units: metric
            network: true
        - resources:
            label: NVMe
            disk: /
        - resources:
            label: SSD1
            disk: /mnt/ssd1
        - resources:
            label: SSD2
            disk: /mnt/ssd2
        - datetime:
            format:
              dateStyle: long
              timeStyle: short
              hourCycle: h23
        EOF

        # Empty, or Homepage fills it with its example bookmarks.
        echo '[]' > /app/config/bookmarks.yaml

        exec docker-entrypoint.sh node server.js
    # /app/config holds only the generated files and Homepage's logs, so nothing needs to persist. The SSD mounts are read-only and only feed the disk-usage widgets.
    tmpfs:
      - /app/config
    volumes:
      - /mnt/ssd1:/mnt/ssd1:ro
      - /mnt/ssd2:/mnt/ssd2:ro
    # The image has its own healthcheck; the label lets autoheal act on it.
    labels:
      autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.5
