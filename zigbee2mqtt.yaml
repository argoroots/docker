services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    cap_drop:
      - all
    # Mosquitto starts as root and drops to the mosquitto user; without these it cannot make that switch and exits.
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      TZ: Europe/Tallinn
    # Mosquitto has no env-var configuration, so the config is written at start. Persistence is deliberately off; nothing here needs retained state.
    command:
      - sh
      - -c
      - |
        printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > /tmp/mosquitto.conf
        exec mosquitto -c /tmp/mosquitto.conf
    # Published to localhost only: HA reaches it at 127.0.0.1 over host networking, Zigbee2MQTT as mosquitto:1883 on this stack's network. Nothing on the LAN can connect, which is what makes allow_anonymous acceptable.
    ports:
      - 127.0.0.1:1883:1883
    # /tmp holds the generated config, so it must be writable under read_only. The image declares the other two as volumes; tmpfs stops Docker creating a new anonymous volume on every recreate.
    tmpfs:
      - /tmp
      - /mosquitto/data:uid=1883,gid=1883
      - /mosquitto/log:uid=1883,gid=1883
    # A publish proves the broker is actually accepting connections, not just that the process is alive.
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
      # Checked every 5 s while starting, so Zigbee2MQTT is not held back a full interval.
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    # Only applies on deploy; after a reboot Docker starts both at once and Zigbee2MQTT may restart until the broker is up.
    depends_on:
      mosquitto:
        condition: service_healthy
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
    # The frontend listens on 9123, set in configuration.yaml; nothing else in Zigbee2MQTT serves HTTP.
    ports:
      - 9123:9123
      # Onboarding wizard: only runs on 8080 on a fresh install (no configuration.yaml). Uncomment for first setup; host 8084 because OTBR's web UI uses host 8080.
      # - 8084:8080
    volumes:
      - zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/serial/by-id/${ZIGBEE_TONGLE_ID}:/dev/ttyUSB0
    # The container stays "Up" when the process hangs; this catches that.
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9123/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: 1.0

volumes:
  zigbee2mqtt:
    name: zigbee2mqtt
