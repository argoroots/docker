services:
  beszel-agent:
    image: henrygd/beszel-agent:alpine
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - all
    cap_add:
      - SYS_RAWIO # required for S.M.A.R.T. data
      - SYS_ADMIN # required for NVMe S.M.A.R.T. data
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      HUB_URL: https://d.tesla.roots.ee
      SMART_DEVICES: /dev/nvme0:nvme,/dev/sda:sat,/dev/sdb:sat
    volumes:
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beszel-agent:/var/lib/beszel-agent
      - /mnt/ssd1/.beszel:/extra-filesystems/sda2__SSD1:ro
      - /mnt/ssd2/.beszel:/extra-filesystems/sdb2__SSD2:ro
    devices:
      - /dev/nvme0:/dev/nvme0
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: 0.5

volumes:
  beszel-agent:
    name: beszel-agent
