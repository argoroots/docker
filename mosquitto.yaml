services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    environment:
      TZ: Europe/Tallinn
    # Mosquitto has no env-var configuration, so the config is written at start.
    # Persistence is deliberately off; nothing here needs retained state.
    command:
      - sh
      - -c
      - |
        printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > /tmp/mosquitto.conf
        exec mosquitto -c /tmp/mosquitto.conf
    ports:
      - 1883:1883
    # The image declares these as volumes; tmpfs stops Docker creating a new
    # anonymous volume on every recreate. Persistence is off and logs go to
    # stdout, so nothing here needs to survive a restart.
    tmpfs:
      - /mosquitto/data
      - /mosquitto/log
    networks:
      - iot
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5

networks:
  iot:
    name: iot
    external: true
