# Portainer cannot deploy its own stack (redeploying would kill it mid-operation), so this one is applied by hand on the host, not from git:
#   sudo cp portainer.yaml /home/pi/docker-compose.yml
#   docker compose -f /home/pi/docker-compose.yml up -d
services:
  portainer:
    image: portainer/portainer-ee:latest
    container_name: portainer
    restart: unless-stopped
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
    ports:
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.5

volumes:
  portainer:
    name: portainer
    external: true
