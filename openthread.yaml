services:
  # Installs the host kernel settings OTBR depends on, then exits. Docker refuses
  # `sysctls:` on host-network services, so this runs on deploy to write the file
  # into /etc/sysctl.d and apply it; systemd-sysctl re-applies it on boot.
  openthread-sysctl:
    image: alpine:latest
    container_name: openthread-sysctl
    restart: "no"
    network_mode: host
    privileged: true
    environment:
      TZ: Europe/Tallinn
    volumes:
      - /etc/sysctl.d:/etc/sysctl.d
    command:
      - sh
      - -c
      - |
        cat > /etc/sysctl.d/60-otbr.conf <<'EOF'
        # Managed by openthread.yaml -- do not edit on the host, changes are overwritten.
        #
        # Order matters: writing net.ipv6.conf.all.forwarding resets per-interface
        # RA state, so the accept_ra settings must come after it.

        # OTBR routes between the infra interface and the Thread mesh. Without IPv6
        # forwarding, every Matter-over-Thread device is unreachable.
        net.ipv6.conf.all.forwarding=1
        net.ipv4.ip_forward=1

        # The interface below must match OT_INFRA_IF above. Set to wlan0: the
        # wired segment does not carry mDNS from the WiFi clients (HomePods,
        # Apple TV), so Matter discovery only works from the WiFi side.
        #
        # accept_ra=2 -- with forwarding enabled the kernel ignores RAs at the
        # default of 1; 2 means "accept them anyway".
        #
        # accept_ra_rt_info_max_plen=64 -- defaults to 0, which discards the Route
        # Information Option carrying OTBR's OMR prefix. Without this, border
        # routing reports healthy (ot-ctl br state == running) while no device is
        # reachable.
        net.ipv6.conf.wlan0.accept_ra=2
        net.ipv6.conf.wlan0.accept_ra_rt_info_max_plen=64
        EOF
        sysctl -p /etc/sysctl.d/60-otbr.conf
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: 0.1

  openthread:
    image: openthread/border-router:latest
    container_name: openthread
    restart: unless-stopped
    network_mode: host
    depends_on:
      openthread-sysctl:
        condition: service_completed_successfully
    cap_add:
      - NET_ADMIN
      - NET_RAW
    group_add:
      - 20
    environment:
      TZ: Europe/Tallinn
      OT_FORM_NETWORK: "1"
      OT_INFRA_IF: wlan0
      OT_LOG_LEVEL: 3
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyUSB0?uart-baudrate=460800"
      OT_THREAD_IF: wpan0
      OTBR_ENABLE_TD_SERVER: "1"
    volumes:
      - /home/pi/openthread:/data
    devices:
      - /dev/serial/by-id/${THREAD_TONGLE_ID}:/dev/ttyUSB0
      - /dev/net/tun:/dev/net/tun
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: 1.0

  openthread-web:
    image: alpine/socat:latest
    container_name: openthread-web
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Tallinn
    command: TCP-LISTEN:8090,fork,reuseaddr TCP:127.0.0.1:8080
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 0.25

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor=unconfined
    environment:
      TZ: Europe/Tallinn
    # --primary-interface: without it the controller advertises itself on every
    # docker bridge and veth, where no device can reach it.
    # --bluetooth-adapter: commission Matter devices over BLE from the Pi itself,
    # so no phone is involved and no foreign Thread credentials get handed out.
    command: --primary-interface wlan0 --bluetooth-adapter 0
    volumes:
      - /home/pi/matter-server:/data
      - /run/dbus:/run/dbus:ro
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: 1.0
