services:
  esphome:
    image: ghcr.io/esphome/esphome:latest
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - esphome:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: 3.0

volumes:
  esphome:
    name: esphome
