services:
  caddy:
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:builder AS builder
        RUN xcaddy build --with github.com/caddy-dns/digitalocean@master
        FROM caddy:latest
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    image: caddy-digitalocean:local
    # Built here, never pushed: skips Portainer's re-pull (which would fail) and rebuilds on every deploy instead.
    pull_policy: build
    container_name: caddy
    restart: unless-stopped
    # Host networking so every service is reachable at 127.0.0.1.
    network_mode: host
    cap_drop:
      - all
    # Binding 80/443 needs this once all other capabilities are dropped.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Tallinn
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN}
    # The Caddyfile is written at start, like Mosquitto's config, so the whole proxy setup lives in this file.
    command:
      - sh
      - -c
      - |
        cat > /etc/caddy/Caddyfile <<'EOF'
        (dns) {
        	tls {
        		dns digitalocean {env.DO_AUTH_TOKEN}
        		# Caddy's own check that the challenge record is visible kept timing out for pi.roots.ee; give DigitalOcean 30 s, then let Let's Encrypt check it directly.
        		propagation_delay 30s
        		propagation_timeout -1
        		resolvers 1.1.1.1 8.8.8.8
        	}
        }

        pi.roots.ee {
        	import dns
        	reverse_proxy 127.0.0.1:3000
        }

        *.pi.roots.ee {
        	import dns

        	@ha host ha.pi.roots.ee
        	handle @ha {
        		reverse_proxy 127.0.0.1:8123
        	}

        	@z2m host z2m.pi.roots.ee
        	handle @z2m {
        		reverse_proxy 127.0.0.1:9123
        	}

        	@esphome host esphome.pi.roots.ee
        	handle @esphome {
        		reverse_proxy 127.0.0.1:6052
        	}

        	@music host music.pi.roots.ee
        	handle @music {
        		reverse_proxy 127.0.0.1:8095
        	}

        	@files host files.pi.roots.ee
        	handle @files {
        		reverse_proxy 127.0.0.1:8082
        	}

        	# Web player only; Plex apps connect to 32400 directly. Plex's root path serves XML, so it goes to the player.
        	@plex host plex.pi.roots.ee
        	handle @plex {
        		redir / /web/
        		reverse_proxy 127.0.0.1:32400
        	}

        	# Portainer only serves HTTPS with its own self-signed certificate.
        	@portainer host portainer.pi.roots.ee
        	handle @portainer {
        		reverse_proxy https://127.0.0.1:9443 {
        			transport http {
        				tls_insecure_skip_verify
        			}
        		}
        	}

        	# Unknown subdomains get no response rather than some other service.
        	handle {
        		abort
        	}
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      # Certificates and the ACME account; losing them only means re-issuing, but Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config
    labels:
      autoheal: "true"
    # The admin API only answers on localhost and proves Caddy is running with a loaded config.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.5

volumes:
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config
